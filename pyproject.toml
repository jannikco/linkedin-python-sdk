[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadadapter-client"
version = "0.1.0"
description = "Stdlib LeadAdapter REST client with generated operation metadata"
requires-python = ">=3.10"

[tool.setuptools]
packages = ["leadadapter"]

[tool.setuptools.package-data]
leadadapter = ["operations.json"]
